<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1150" viewBox="0 0 1120 1150" role="img" aria-labelledby="title description">
<title id="title">Oryn SDK request lifecycle</title><desc id="description">Detect capabilities; request a model and allow Browser consent and Engine preparation; receive a session; submit a queued job; consume events and a completed, failed, or cancelled terminal outcome; release sessions and artifacts. Failures or cancellation can also occur during preparation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b2adff"/></marker></defs>
<rect width="1120" height="1150" rx="24" fill="#0c0e14"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="52" font-size="15" font-weight="700" fill="#b2adff" letter-spacing="2">ORYN SDK  /  REQUEST LIFECYCLE</text>
<text x="48" y="111" font-size="40" font-weight="700" fill="#f1f3fa" >From intent to a local result.</text>
<text x="48" y="151" font-size="21" font-weight="400" fill="#b4bed2" >The website asks. Oryn mediates. The user stays in control.</text>
<path d="M 80 289 V 333" fill="none" stroke="#b2adff" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="80" cy="237" r="29" fill="#24243e" stroke="#655e9b"/>
<text x="80" y="244" font-size="20" font-weight="700" fill="#b2adff" text-anchor="middle">01</text>
<rect x="134" y="201" width="938" height="115" rx="18" fill="#151923" stroke="#333b50" stroke-width="1.5"/>
<text x="158" y="235" font-size="24" font-weight="700" fill="#f1f3fa" >Detect</text>
<text x="1048" y="233" font-size="12" font-weight="700" fill="#b2adff" text-anchor="end" letter-spacing="1">WEBSITE</text>
<text x="158" y="266" font-size="18" font-weight="400" fill="#b2adff" font-family="Menlo, Consolas, monospace">getCapabilities()</text>
<text x="158" y="297" font-size="18" font-weight="400" fill="#b4bed2" >Check availability; offer a fallback.</text>
<path d="M 80 426 V 470" fill="none" stroke="#b2adff" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="80" cy="374" r="29" fill="#24243e" stroke="#655e9b"/>
<text x="80" y="381" font-size="20" font-weight="700" fill="#b2adff" text-anchor="middle">02</text>
<rect x="134" y="338" width="938" height="115" rx="18" fill="#151923" stroke="#333b50" stroke-width="1.5"/>
<text x="158" y="372" font-size="24" font-weight="700" fill="#f1f3fa" >Resolve</text>
<text x="1048" y="370" font-size="12" font-weight="700" fill="#b2adff" text-anchor="end" letter-spacing="1">BROWSER + ENGINE</text>
<text x="158" y="403" font-size="18" font-weight="400" fill="#b2adff" font-family="Menlo, Consolas, monospace">models.request(...)</text>
<text x="158" y="434" font-size="18" font-weight="400" fill="#b4bed2" >Permission, model choice, download and load.</text>
<path d="M 80 563 V 607" fill="none" stroke="#b2adff" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="80" cy="511" r="29" fill="#24243e" stroke="#655e9b"/>
<text x="80" y="518" font-size="20" font-weight="700" fill="#b2adff" text-anchor="middle">03</text>
<rect x="134" y="475" width="938" height="115" rx="18" fill="#151923" stroke="#333b50" stroke-width="1.5"/>
<text x="158" y="509" font-size="24" font-weight="700" fill="#f1f3fa" >Receive a session</text>
<text x="1048" y="507" font-size="12" font-weight="700" fill="#b2adff" text-anchor="end" letter-spacing="1">WEBSITE</text>
<text x="158" y="540" font-size="18" font-weight="400" fill="#b2adff" font-family="Menlo, Consolas, monospace">ModelSession</text>
<text x="158" y="571" font-size="18" font-weight="400" fill="#b4bed2" >Inspect the resolved model and task profile.</text>
<path d="M 80 700 V 744" fill="none" stroke="#b2adff" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="80" cy="648" r="29" fill="#24243e" stroke="#655e9b"/>
<text x="80" y="655" font-size="20" font-weight="700" fill="#b2adff" text-anchor="middle">04</text>
<rect x="134" y="612" width="938" height="115" rx="18" fill="#151923" stroke="#333b50" stroke-width="1.5"/>
<text x="158" y="646" font-size="24" font-weight="700" fill="#f1f3fa" >Submit a job</text>
<text x="1048" y="644" font-size="12" font-weight="700" fill="#b2adff" text-anchor="end" letter-spacing="1">SDK + ENGINE</text>
<text x="158" y="677" font-size="18" font-weight="400" fill="#b2adff" font-family="Menlo, Consolas, monospace">invokeAndWait() / invokeStream()</text>
<text x="158" y="708" font-size="18" font-weight="400" fill="#b4bed2" >Helpers subscribe before submitting; work may queue.</text>
<path d="M 80 837 V 881" fill="none" stroke="#b2adff" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="80" cy="785" r="29" fill="#24243e" stroke="#655e9b"/>
<text x="80" y="792" font-size="20" font-weight="700" fill="#b2adff" text-anchor="middle">05</text>
<rect x="134" y="749" width="938" height="115" rx="18" fill="#151923" stroke="#333b50" stroke-width="1.5"/>
<text x="158" y="783" font-size="24" font-weight="700" fill="#f1f3fa" >Observe the outcome</text>
<text x="1048" y="781" font-size="12" font-weight="700" fill="#98ddc5" text-anchor="end" letter-spacing="1">WEBSITE</text>
<text x="158" y="814" font-size="18" font-weight="400" fill="#98ddc5" font-family="Menlo, Consolas, monospace">LocalAIEvent / InferenceResult</text>
<text x="158" y="845" font-size="18" font-weight="400" fill="#b4bed2" >Progress, text deltas, previews, then one terminal event.</text>
<circle cx="80" cy="922" r="29" fill="#24243e" stroke="#655e9b"/>
<text x="80" y="929" font-size="20" font-weight="700" fill="#b2adff" text-anchor="middle">06</text>
<rect x="134" y="886" width="938" height="115" rx="18" fill="#151923" stroke="#333b50" stroke-width="1.5"/>
<text x="158" y="920" font-size="24" font-weight="700" fill="#f1f3fa" >Release resources</text>
<text x="1048" y="918" font-size="12" font-weight="700" fill="#b2adff" text-anchor="end" letter-spacing="1">WEBSITE</text>
<text x="158" y="951" font-size="18" font-weight="400" fill="#b2adff" font-family="Menlo, Consolas, monospace">releaseSession() / artifacts.release()</text>
<text x="158" y="982" font-size="18" font-weight="400" fill="#b4bed2" >Clean up when the feature and media consumers finish.</text>
<rect x="134" y="1034" width="938" height="77" rx="18" fill="#1a2230" stroke="#333b50" stroke-width="1.5"/>
<text x="158" y="1066" font-size="20" font-weight="700" fill="#98ddc5" >Terminal outcomes: completed · failed · cancelled</text>
<text x="158" y="1094" font-size="17" font-weight="400" fill="#b4bed2" >Requests can also fail or be cancelled before a session or job is created.</text>
</g></svg>
