name: Public source CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  AWS_EC2_METADATA_DISABLED: 'true'

concurrency:
  group: public-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            components/protocol/pnpm-lock.yaml
            components/sdk/pnpm-lock.yaml
            components/browser/pnpm-lock.yaml
            components/examples/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12.16'
          enable-cache: true
          cache-dependency-glob: |
            components/protocol/python/uv.lock
            components/engine/uv.lock
      - name: Bootstrap from the public checkout
        run: ./scripts/bootstrap
      - name: Verify the reviewed CPython parser
        run: >-
          components/engine/.venv/bin/python -I -S -c
          'import sys; assert sys.implementation.name == "cpython" and sys.version_info[:3] == (3, 12, 16), sys.version'
      - name: Verify public sources and bundled dependencies
        run: pnpm vendor:verify && pnpm docs:check
      - name: Build and test Protocol and SDK
        run: |
          pnpm --dir components/protocol validate
          pnpm --dir components/sdk typecheck
          pnpm --dir components/sdk test
          pnpm --dir components/sdk build
      - name: Build and test Browser
        run: |
          pnpm --dir components/browser security:verify
          pnpm --dir components/browser typecheck
          pnpm --dir components/browser test
          pnpm --dir components/browser build
      - name: Build and test Examples and public documentation
        run: |
          pnpm --dir components/examples test
          node scripts/check-public-docs.mjs --all

  engine:
    name: Engine tests (shard ${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            components/protocol/pnpm-lock.yaml
            components/sdk/pnpm-lock.yaml
            components/browser/pnpm-lock.yaml
            components/examples/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12.16'
          enable-cache: true
          cache-dependency-glob: |
            components/protocol/python/uv.lock
            components/engine/uv.lock
      - name: Bootstrap from the public checkout
        run: ./scripts/bootstrap
      - name: Verify the reviewed CPython parser
        run: >-
          components/engine/.venv/bin/python -I -S -c
          'import sys; assert sys.implementation.name == "cpython" and sys.version_info[:3] == (3, 12, 16), sys.version'
      - name: Test Engine file shard
        run: >-
          uv run --project components/engine --python 3.12.16 --frozen
          python scripts/test-engine-shard.py --index ${{ matrix.shard }} --count 3
          --report .workspace-artifacts/engine-shard-${{ matrix.shard }}.json
      - name: Build Engine wheel
        run: uv build --project components/engine --python 3.12.16
      - name: Retain Engine shard inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-shard-${{ matrix.shard }}
          path: .workspace-artifacts/engine-shard-${{ matrix.shard }}.json
          if-no-files-found: warn
